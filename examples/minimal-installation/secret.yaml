# One Secret feeding Rikoo and the bundled stores. Replace every value before applying. The
# sealing pair is an RSA 3072 key in PEM, generated with OpenSSL:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out sealing.private
#   openssl pkey -in sealing.private -pubout -out sealing.public
# In a GitOps pipeline, produce this object with an external secrets operator instead of committing it.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: rikoo
stringData:
  # Rikoo application keys, 32 characters minimum (`openssl rand -hex 24`)
  widget-signing-key: "replace-me-with-32-chars-minimum-xxxxxxxx"
  totp-key: "replace-me-with-32-chars-minimum-yyyyyyyy"
  sandbox-token-secret: "replace-me-with-32-chars-minimum-zzzzzzzz"

  # Vault sealing pair. The api gets `sealing.pub`, the worker `sealing.key`.
  sealing.pub: |
    -----BEGIN PUBLIC KEY-----
    replace-me
    -----END PUBLIC KEY-----
  sealing.key: |
    -----BEGIN PRIVATE KEY-----
    replace-me
    -----END PRIVATE KEY-----

  # Bundled PostgreSQL. This role is the superuser of that instance: the first migration creates
  # the pgvector and citext extensions.
  POSTGRES_USER: "rikoo"
  POSTGRES_PASSWORD: "replace-me-postgres"
  POSTGRES_DB: "rikoo"

  # Bundled MinIO
  rootUser: "rikoo"
  rootPassword: "replace-me-minio-16-chars-min"
