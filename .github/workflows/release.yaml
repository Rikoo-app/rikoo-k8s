name: Release Chart

on:
  push:
    branches:
      - main
    paths:
      - "charts/rikoo/Chart.yaml"
  # Manual re-release: publishes whatever version main's Chart.yaml holds. The OCI push is
  # idempotent for an existing version.
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Update dependencies
        run: helm dependency update charts/rikoo/

      - name: Read chart name and version
        id: chart
        run: |
          echo "name=$(yq e '.name' charts/rikoo/Chart.yaml)" >> "$GITHUB_OUTPUT"
          echo "version=$(yq e '.version' charts/rikoo/Chart.yaml)" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package
        run: helm package charts/rikoo --version "$CHART_VERSION"
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}

      - name: Push
        run: helm push "${CHART_NAME}-${CHART_VERSION}.tgz" "oci://ghcr.io/${REPO}/charts"
        env:
          CHART_NAME: ${{ steps.chart.outputs.name }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          REPO: ${{ steps.chart.outputs.repo }}
