{{- if .Values.rikoo.serviceAccount.create -}}
{{- /*
One ServiceAccount for every Rikoo pod. No Role is bound to it: no Rikoo process talks to the
Kubernetes API, and the token is not mounted (automountServiceAccountToken: false by default). The
account exists so that cloud identities (IRSA, Workload Identity) can be attached through
annotations, e.g. to reach a managed object storage without static keys.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rikoo.serviceAccountName" . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "rikoo.labels" . | nindent 4 }}
  {{- with .Values.rikoo.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.rikoo.serviceAccount.automountServiceAccountToken }}
{{- end }}
