{{- /*
Credentials of the bundled MinIO, under the name and keys the minio sub-chart expects
(`existingSecret` with `rootUser` / `rootPassword`). The api signs presigned URLs with the same
pair, the worker reads and writes objects with it. Not rendered when the operator points
`s3.existingSecret` at a Secret of their own.
*/ -}}
{{- if and .Values.s3.deploy (eq (include "rikoo.s3.authSecretName" .) "rikoo-s3-auth") -}}
{{- $name := include "rikoo.s3.authSecretName" . -}}
{{- $rootUser := required "s3.auth.rootUser is required when s3.deploy=true" .Values.s3.auth.rootUser -}}
{{- $rootPassword := .Values.s3.auth.rootPassword -}}
{{- if not $rootPassword -}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
  {{- if and $existing (index $existing.data "rootPassword") -}}
    {{- $rootPassword = index $existing.data "rootPassword" | b64dec -}}
  {{- else -}}
    {{- $rootPassword = randAlphaNum 40 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "rikoo.labels" . | nindent 4 }}
  annotations:
    # Never garbage-collect generated credentials, even on uninstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  rootUser: {{ $rootUser | b64enc | quote }}
  rootPassword: {{ $rootPassword | b64enc | quote }}
{{- end }}
