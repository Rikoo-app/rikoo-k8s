{{- /*
Chart-managed Secret for the symmetric application keys Rikoo cannot regenerate without a cost:
WIDGET_SIGNING_KEY (every widget token), WIDGET_VISITOR_KEY (verified visitor identity),
RIKOO_TOTP_KEY (2FA secrets at rest, derived from the signing key when absent — pinned here so a
rotation of one never silently rotates the other), MCP_SANDBOX_TOKEN_SECRET (worker <-> sandbox).

Per key: a value already stored in the cluster is preserved verbatim, a missing credential is
generated, and a credential provided via value/secretKeyRef adds nothing here (the pod env reads
the operator's source directly). helm.sh/resource-policy keeps the Secret through uninstall.

Caveat: under helm-template GitOps (ArgoCD) `lookup` cannot see the cluster and generated values
would rotate on every sync — pin every key via value/secretKeyRef there.
*/ -}}
{{- $s := .Values.rikoo.secrets -}}
{{- $name := include "rikoo.appSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $existingData := dict -}}
{{- if $existing -}}{{- $existingData = $existing.data | default dict -}}{{- end -}}
{{- $provided := dict
  "widget-signing-key" (include "rikoo.isProvided" $s.widgetSigningKey)
  "widget-visitor-key" (include "rikoo.isProvided" $s.widgetVisitorKey)
  "totp-key" (include "rikoo.isProvided" $s.totpKey)
  "sandbox-token-secret" (include "rikoo.isProvided" $s.sandboxTokenSecret)
-}}
{{- $data := dict -}}
{{- range $key, $isProvided := $provided -}}
  {{- if index $existingData $key -}}
    {{- $_ := set $data $key (index $existingData $key) -}}
  {{- else if not $isProvided -}}
    {{- $_ := set $data $key (randAlphaNum 48 | b64enc) -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "rikoo.labels" . | nindent 4 }}
  annotations:
    # Never garbage-collect generated credentials, even on uninstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
