{{- /*
Credentials of the bundled PostgreSQL. The groundhog2k sub-chart reads POSTGRES_USER /
POSTGRES_PASSWORD from `postgresql.settings.existingSecret` and POSTGRES_DB through
`postgresql.env`; the api and worker build DATABASE_URL from the same keys. The application role
IS the superuser of the bundled instance, because the first migration creates the pgvector and
citext extensions. A managed database (deploy: false) brings its own role.
*/ -}}
{{- if and .Values.postgresql.deploy (not .Values.postgresql.auth.existingSecret) -}}
{{- $name := include "rikoo.postgresql.authSecretName" . -}}
{{- $password := .Values.postgresql.auth.password -}}
{{- if not $password -}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
  {{- if and $existing (index $existing.data "POSTGRES_PASSWORD") -}}
    {{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec -}}
  {{- else -}}
    {{- $password = randAlphaNum 40 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "rikoo.labels" . | nindent 4 }}
  annotations:
    # Never garbage-collect generated credentials, even on uninstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  POSTGRES_USER: {{ required "postgresql.auth.username is required when deploy=true" .Values.postgresql.auth.username | toString | b64enc | quote }}
  POSTGRES_PASSWORD: {{ $password | b64enc | quote }}
  POSTGRES_DB: {{ required "postgresql.auth.database is required when deploy=true" .Values.postgresql.auth.database | toString | b64enc | quote }}
{{- end }}
{{- if and (not .Values.postgresql.deploy) (not .Values.postgresql.auth.existingSecret) (not (include "rikoo.isProvided" .Values.postgresql.url)) (.Values.postgresql.auth.password) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rikoo.fullname" . }}-postgresql
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "rikoo.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.postgresql.auth.password | toString | b64enc | quote }}
{{- end }}
