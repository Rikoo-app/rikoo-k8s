{{- /*
Vault sealing pair handed over inline through values. The private key lands in a Secret
mounted as a FILE in the worker only (RIKOO_SECRETS_PRIVATE_KEY_FILE), the recommended production
path of the product manifest; the api reads the public key from the same Secret as an env variable.

Nothing is generated here: Helm cannot derive the public key from a private one, and a pair the
chart would regenerate on a lost lookup would make every sealed secret of every organisation
unreadable. Create the pair yourself, RSA 3072 in PEM, with OpenSSL.

Rendered only when the keys are given by VALUE. With secretKeyRef, the worker mounts the
referenced Secrets directly; with existingSecret, that Secret is mounted as is.
*/ -}}
{{- $sealing := .Values.rikoo.secrets.sealing -}}
{{- if and (not $sealing.existingSecret) (or $sealing.publicKey.value $sealing.privateKey.value $sealing.previousPrivateKeys.value) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rikoo.sealingSecretName" . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "rikoo.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- with $sealing.publicKey.value }}
  sealing.pub: {{ . | b64enc | quote }}
  {{- end }}
  {{- with $sealing.privateKey.value }}
  sealing.key: {{ . | b64enc | quote }}
  {{- end }}
  {{- with $sealing.previousPrivateKeys.value }}
  sealing.previous.key: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
