{{- $c := .Values.rikoo.worker -}}
{{- if $c.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "rikoo.worker.serviceName" . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "rikoo.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    name: {{ include "rikoo.worker.serviceName" . }}
  minReplicaCount: {{ $c.keda.minReplicas }}
  maxReplicaCount: {{ $c.keda.maxReplicas }}
  pollingInterval: {{ $c.keda.pollingInterval }}
  {{- /*
  `keda.triggers`, when set, is passed through as is: a queue-driven process does not scale on its
  own CPU, and a Redis or Prometheus scaler needs metadata this chart has no business modelling.
  Left empty, the single resource trigger below keeps working, which is what every existing values
  file expresses.
  */}}
  {{- if $c.keda.triggers }}
  triggers:
    {{- toYaml $c.keda.triggers | nindent 4 }}
  {{- else }}
  triggers:
    - type: {{ $c.keda.triggerType }}
      metricType: {{ $c.keda.metricType }}
      metadata:
        value: {{ $c.keda.value | quote }}
        {{- with $c.keda.containerName }}
        containerName: {{ . | quote }}
        {{- end }}
  {{- end }}
{{- end }}
