suite: chart-managed Secrets
templates:
  - secrets/app-secret.yaml
  - secrets/sealing-secret.yaml
  - secrets/postgresql-secret.yaml
  - secrets/s3-secret.yaml
tests:
  - it: generates the four application keys and keeps the Secret through uninstall
    values:
      - ../values.lint.yaml
    asserts:
      - isKind:
          of: Secret
        template: secrets/app-secret.yaml
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        template: secrets/app-secret.yaml
      - isNotEmpty:
          path: data["widget-signing-key"]
        template: secrets/app-secret.yaml
      - isNotEmpty:
          path: data["widget-visitor-key"]
        template: secrets/app-secret.yaml
      - isNotEmpty:
          path: data["totp-key"]
        template: secrets/app-secret.yaml
      - isNotEmpty:
          path: data["sandbox-token-secret"]
        template: secrets/app-secret.yaml

  - it: does not generate a key the operator provides
    values:
      - ../values.lint.yaml
    set:
      rikoo.secrets.widgetSigningKey.value: 0123456789abcdef0123456789abcdef
      rikoo.secrets.sandboxTokenSecret.secretKeyRef:
        name: mine
        key: token
    asserts:
      - isNull:
          path: data["widget-signing-key"]
        template: secrets/app-secret.yaml
      - isNull:
          path: data["sandbox-token-secret"]
        template: secrets/app-secret.yaml
      - isNotEmpty:
          path: data["totp-key"]
        template: secrets/app-secret.yaml

  - it: stores an inline sealing pair in the chart-managed Secret
    values:
      - ../values.lint.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-rikoo-sealing
        template: secrets/sealing-secret.yaml
      - isNotEmpty:
          path: data["sealing.pub"]
        template: secrets/sealing-secret.yaml
      - isNotEmpty:
          path: data["sealing.key"]
        template: secrets/sealing-secret.yaml

  - it: renders no sealing Secret when the operator brings one
    values:
      - ../values.lint.yaml
    set:
      rikoo.secrets.sealing.existingSecret: my-sealing
    asserts:
      - hasDocuments:
          count: 0
        template: secrets/sealing-secret.yaml

  - it: writes the bundled PostgreSQL credentials under the keys the sub-chart reads
    values:
      - ../values.lint.yaml
    set:
      postgresql.auth.password: fixed-password
    asserts:
      - equal:
          path: metadata.name
          value: rikoo-postgresql-auth
        template: secrets/postgresql-secret.yaml
      - equal:
          path: data.POSTGRES_USER
          value: cmlrb28=
        template: secrets/postgresql-secret.yaml
      - equal:
          path: data.POSTGRES_PASSWORD
          value: Zml4ZWQtcGFzc3dvcmQ=
        template: secrets/postgresql-secret.yaml
      - equal:
          path: data.POSTGRES_DB
          value: cmlrb28=
        template: secrets/postgresql-secret.yaml

  - it: writes the bundled MinIO credentials under the keys the sub-chart reads
    values:
      - ../values.lint.yaml
    set:
      s3.auth.rootPassword: fixed-minio
    asserts:
      - equal:
          path: metadata.name
          value: rikoo-s3-auth
        template: secrets/s3-secret.yaml
      - equal:
          path: data.rootUser
          value: cmlrb28=
        template: secrets/s3-secret.yaml
      - equal:
          path: data.rootPassword
          value: Zml4ZWQtbWluaW8=
        template: secrets/s3-secret.yaml

  - it: leaves the MinIO Secret to the operator when s3.existingSecret is theirs
    values:
      - ../values.lint.yaml
    set:
      s3.existingSecret: my-minio
    asserts:
      - hasDocuments:
          count: 0
        template: secrets/s3-secret.yaml
