suite: basic chart functionality
templates:
  - api/deployment.yaml
  - worker/deployment.yaml
  - api/service.yaml
  - worker/service.yaml
  - serviceaccount.yaml
  - configmap-env.yaml
  - api/pdb.yaml
  - worker/pdb.yaml
tests:
  - it: renders one document per template with the lint values
    values:
      - ../values.lint.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
        template: api/deployment.yaml
      - isKind:
          of: Deployment
        template: worker/deployment.yaml
      - isKind:
          of: Service
        template: api/service.yaml
      - isKind:
          of: ServiceAccount
        template: serviceaccount.yaml
      - isKind:
          of: ConfigMap
        template: configmap-env.yaml

  - it: sets the standard labels and the component selector
    values:
      - ../values.lint.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: rikoo
        template: api/deployment.yaml
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
        template: api/deployment.yaml
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: v0.0.0-lint
        template: api/deployment.yaml
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: api
        template: api/deployment.yaml
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: worker
        template: worker/deployment.yaml
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: api
        template: api/service.yaml

  - it: builds the image reference from the registry, the repository and the shared tag
    values:
      - ../values.lint.yaml
    set:
      rikoo.image.tag: v1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/rikoo/rikoo-api:v1.2.3
        template: api/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/rikoo/rikoo-worker:v1.2.3
        template: worker/deployment.yaml

  - it: lets a component pin its own tag
    values:
      - ../values.lint.yaml
    set:
      rikoo.worker.image.tag: v9.9.9
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: rikoo-worker:v9.9.9$
        template: worker/deployment.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: rikoo-api:v0.0.0-lint$
        template: api/deployment.yaml

  - it: probes the orchestrator paths of the api and the health port of the worker
    values:
      - ../values.lint.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
        template: api/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
        template: api/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
        template: api/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
        template: worker/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 3100
        template: worker/deployment.yaml

  - it: hardens api and worker containers by default
    values:
      - ../values.lint.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
        template: api/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
        template: worker/deployment.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: api/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
        template: api/deployment.yaml

  - it: consumes the shared ConfigMap and rolls the pods on a config change
    values:
      - ../values.lint.yaml
    set:
      rikoo.publicUrl: https://rikoo.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: RELEASE-NAME-rikoo-env
        template: worker/deployment.yaml
      - isNotEmpty:
          path: spec.template.metadata.annotations["checksum/config"]
        template: api/deployment.yaml
      - equal:
          path: data.PUBLIC_URL
          value: https://rikoo.example.com
        template: configmap-env.yaml
      - equal:
          path: data.CORS_ORIGINS
          value: https://rikoo.example.com
        template: configmap-env.yaml
      - equal:
          path: data.TRUST_PROXY_HOPS
          value: "1"
        template: configmap-env.yaml

  - it: creates PodDisruptionBudgets with maxUnavailable 1 by default
    values:
      - ../values.lint.yaml
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
        template: api/pdb.yaml
      - equal:
          path: spec.maxUnavailable
          value: 1
        template: worker/pdb.yaml

  - it: drops the replica count when the HPA drives it
    values:
      - ../values.lint.yaml
    set:
      rikoo.api.hpa.enabled: true
    asserts:
      - isNull:
          path: spec.replicas
        template: api/deployment.yaml
      - equal:
          path: spec.replicas
          value: 1
        template: worker/deployment.yaml
