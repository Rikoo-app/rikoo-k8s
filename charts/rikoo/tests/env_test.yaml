suite: environment contract of api and worker
templates:
  - api/deployment.yaml
  - worker/deployment.yaml
  - configmap-env.yaml
tests:
  - it: builds DATABASE_URL from the bundled PostgreSQL Secret without a literal password
    values:
      - ../values.lint.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RIKOO_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: rikoo-postgresql-auth
                key: POSTGRES_PASSWORD
        template: api/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            value: postgresql://rikoo:$(RIKOO_DB_PASSWORD)@RELEASE-NAME-postgresql:5432/rikoo?schema=public
        template: api/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            value: postgresql://rikoo:$(RIKOO_DB_PASSWORD)@RELEASE-NAME-postgresql:5432/rikoo?schema=public&connection_limit=25
        template: worker/deployment.yaml

  - it: points at the bundled Redis and MinIO Services
    values:
      - ../values.lint.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            value: redis://RELEASE-NAME-redis:6379/0
        template: api/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_ENDPOINT
            value: http://RELEASE-NAME-s3:9000
        template: worker/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: rikoo-s3-auth
                key: rootUser
        template: worker/deployment.yaml

  - it: gives the sealing public key to the api and the private key file to the worker only
    values:
      - ../values.lint.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RIKOO_SECRETS_PUBLIC_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-rikoo-sealing
                key: sealing.pub
        template: api/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RIKOO_SECRETS_PRIVATE_KEY_FILE
            value: /run/secrets/rikoo/sealing.key
        template: api/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RIKOO_SECRETS_PRIVATE_KEY_FILE
            value: /run/secrets/rikoo/sealing.key
        template: worker/deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: sealing
            secret:
              secretName: RELEASE-NAME-rikoo-sealing
              defaultMode: 0400
        template: worker/deployment.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: sealing
            secret:
              secretName: RELEASE-NAME-rikoo-sealing
              defaultMode: 0400
        template: api/deployment.yaml

  - it: mounts an operator Secret holding the pair when existingSecret is set
    values:
      - ../values.lint.yaml
    set:
      rikoo.secrets.sealing.existingSecret: my-sealing
      rikoo.secrets.sealing.existingSecretPreviousKey: old.key
      rikoo.secrets.sealing.publicKey.value: ""
      rikoo.secrets.sealing.privateKey.value: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RIKOO_SECRETS_PUBLIC_KEY
            valueFrom:
              secretKeyRef:
                name: my-sealing
                key: sealing.pub
        template: api/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RIKOO_SECRETS_PRIVATE_KEYS_PREVIOUS_FILE
            value: /run/secrets/rikoo/old.key
        template: worker/deployment.yaml
      - equal:
          path: spec.template.spec.volumes[1].secret.secretName
          value: my-sealing
        template: worker/deployment.yaml

  - it: projects referenced Secrets when the private key comes from a secretKeyRef
    values:
      - ../values.lint.yaml
    set:
      rikoo.secrets.sealing.publicKey:
        value: ""
        secretKeyRef:
          name: vault-keys
          key: pub
      rikoo.secrets.sealing.privateKey:
        value: ""
        secretKeyRef:
          name: vault-keys
          key: priv
      rikoo.secrets.sealing.previousPrivateKeys:
        value: ""
        secretKeyRef:
          name: vault-keys-old
          key: priv
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].projected.sources[0].secret.name
          value: vault-keys
        template: worker/deployment.yaml
      - equal:
          path: spec.template.spec.volumes[1].projected.sources[0].secret.items[0].path
          value: sealing.key
        template: worker/deployment.yaml
      - equal:
          path: spec.template.spec.volumes[1].projected.sources[1].secret.items[0].path
          value: sealing.previous.key
        template: worker/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RIKOO_SECRETS_PRIVATE_KEYS_PREVIOUS_FILE
            value: /run/secrets/rikoo/sealing.previous.key
        template: worker/deployment.yaml

  - it: reads generated app keys from the chart-managed Secret, or the operator's reference
    values:
      - ../values.lint.yaml
    set:
      rikoo.secrets.totpKey.secretKeyRef:
        name: my-keys
        key: totp
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WIDGET_SIGNING_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-rikoo-app
                key: widget-signing-key
        template: worker/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RIKOO_TOTP_KEY
            valueFrom:
              secretKeyRef:
                name: my-keys
                key: totp
        template: api/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_SANDBOX_TOKEN_SECRET
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-rikoo-app
                key: sandbox-token-secret
        template: worker/deployment.yaml

  - it: renders feature flags as on/off and skips the null ones
    values:
      - ../values.lint.yaml
    set:
      rikoo.features.hitl: false
      rikoo.features.otlpFanout: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RIKOO_FEATURE_HITL
            value: "off"
        template: api/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RIKOO_FEATURE_OTLP_FANOUT
            value: "on"
        template: worker/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RIKOO_FEATURE_USAGE
            value: "on"
        template: api/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RIKOO_FEATURE_USAGE
            value: "off"
        template: api/deployment.yaml

  - it: routes OTEL per service and keeps message content capture off
    values:
      - ../values.lint.yaml
    set:
      rikoo.otel.endpoint: http://otel-collector:4318
      rikoo.otel.api.endpoint: http://tempo:4318
      rikoo.otel.api.metricsExporter: prometheus
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://otel-collector:4318
        template: worker/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://tempo:4318
        template: api/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
            value: "false"
        template: worker/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9464
            protocol: TCP
        template: api/deployment.yaml

  - it: passes extra settings and additional env through
    values:
      - ../values.lint.yaml
    set:
      rikoo.worker.settings.RUN_LOCK_TTL_MS: "60000"
      rikoo.additionalEnv:
        - name: RLS_ORG_POOL_MAX
          value: "8"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RUN_LOCK_TTL_MS
            value: "60000"
        template: worker/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RLS_ORG_POOL_MAX
            value: "8"
        template: api/deployment.yaml
